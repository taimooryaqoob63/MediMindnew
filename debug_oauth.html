<!DOCTYPE html>
<html>
<head>
    <title>OAuth Debug</title>
</head>
<body>
    <h1>OAuth Debug Page</h1>
    <p>This page helps debug OAuth issues.</p>
    
    <h2>Test Links:</h2>
    <ul>
        <li><a href="/api/login" target="_blank">Test Login (/api/login)</a></li>
        <li><a href="/api/simple-login" target="_blank">Test Simple Login (/api/simple-login)</a></li>
        <li><a href="/api/test-auth" target="_blank">Test Auth Info (/api/test-auth)</a></li>
    </ul>
    
    <h2>Current URL:</h2>
    <p id="current-url"></p>
    
    <h2>URL Parameters:</h2>
    <pre id="url-params"></pre>
    
    <script>
        document.getElementById('current-url').textContent = window.location.href;
        
        const urlParams = new URLSearchParams(window.location.search);
        const params = {};
        for (const [key, value] of urlParams) {
            params[key] = value;
        }
        document.getElementById('url-params').textContent = JSON.stringify(params, null, 2);
        
        // Log any parameters to console
        if (Object.keys(params).length > 0) {
            console.log('URL parameters:', params);
        }
    </script>
</body>
</html>
